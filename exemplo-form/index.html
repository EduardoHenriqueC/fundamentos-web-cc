<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulário HTML</title>
</head>
<body>
    <header>
        <h3>Formulário e Inputs</h3>
    </header>
    <main>
        <form id="registerForm" method="post">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required/>
            <br>
            <label for="e-mail">Endereço de e-mail</label>
            <input type="email" id="email" name="email"/>
            <br>
            <label for="senha">Informe sua senha</label>
            <input type="password" id="senha" name="senha" required minlength="8" title="A senha deve ter no mínimo 8 caracteres"/>
            <br>
            <label for="mensagem">Informe sua mensagem</label>
            <textarea id="mensagem" name="mensagem" rows= "4" cols="30"></textarea>
            <br>
            <label for="evento">Selecione o evento escolhido:</label>
            <!-- Tag de selector, ao selecionar uma das opções o value da option é atribuído ao nome do select 
            key value
            evento: teatro -->
            <select id="evento" nome="evento">
                <option value="Rock">Show de Rock</option>
                <option value="Modao">Show de Sertanejo</option>
                <option value="rartos">Teatro: Comédia</option>
            </select>
            <br>
            <!-- input checkbox -> opção de múltipla escolha -->
            <label for="termos">
                <input type="checkbox" id="termos" name="termos" required>
                Aceito os termos de uso
            </label>
            <br>
            <!-- input type radio - Escolha única -->
            <label><input type="radio" name="pagamento" value=pix/>Pix</label>
            <label><input type="radio" name="pagamento" value=cartão/>Cartão</label>
            <br>
            <input type="date" />
            <br>
            <input type="file" />
            <br>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato esperado: 000.000.000-00"/>
            <!-- Para o type radio funcionar ambos os inputs devem compartilhar o mesmo nome -->
            <br>
            <input type="submit" value="Cadastrar" />
            <button type="button" onclick="">Cancelar</button>

        </form>
    </main>
    <footer>
        <p>Desenvolvido por Eduardo</p>
    </footer>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event)
        {
            event.preventDefault(); // impede o comportamento padrão de envio do formulário (recarregamento)
            const nome = document.getElementById('nome').value;
            alert('Olá, ' + nome + ' cadastro enviado com sucesso!');
        })
    </script>
</body>
</html>
